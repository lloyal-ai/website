<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting… | LLoyal Labs</title>
    <meta name="theme-color" content="#050505" />
    <script>
      (function () {
        if (!/(?:^|[?&])utm_/.test(location.search)) {
          var sep = location.search ? '&' : '?';
          history.replaceState(null, '', location.pathname + location.search + sep + 'utm_source=substack&utm_medium=referral&utm_campaign=launch_2026_09_22&utm_content=substack-article1' + location.hash);
        }
      })();
    </script>
    <!-- Google tag (gtag.js) - direct, not via GTM: see the file header for why. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3RM5YS9XH1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-3RM5YS9XH1', { send_page_view: false });
    </script>
    <meta http-equiv="refresh" content="2;url=https://github.com/lloyal-ai/lloyal-ai" />
    <style>
      html, body { background: #050505; color: #e8e8e8; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; text-align: center; }
      a { color: #e8e8e8; }
    </style>
  </head>
  <body>
    <p>
      Taking you to GitHub…<br />
      <noscript><a href="https://github.com/lloyal-ai/lloyal-ai">https://github.com/lloyal-ai/lloyal-ai</a></noscript>
    </p>
    <script>
      (function () {
        var dest = 'https://github.com/lloyal-ai/lloyal-ai';
        var redirected = false;
        function go() {
          if (redirected) return;
          redirected = true;
          location.replace(dest);
        }
        var fallback = setTimeout(go, 1200);
        gtag('event', 'page_view', {
          event_callback: function () {
            clearTimeout(fallback);
            go();
          },
          event_timeout: 1200,
        });
      })();
    </script>
  </body>
</html>
