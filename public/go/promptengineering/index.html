      Taking you to GitHub…<br />
      <noscript><a href="https://github.com/lloyal-ai/lloyal-ai">https://github.com/lloyal-ai/lloyal-ai</a></noscript>
    </p>
    <script>
      (function () {
        var dest = 'https://github.com/lloyal-ai/lloyal-ai';
        var redirected = false;
        function go() {
          if (redirected) return;
          redirected = true;
          location.replace(dest);
        }
        var fallback = setTimeout(go, 1200);
        if (window.dataLayer) {
          window.dataLayer.push({
            event: 'go_redirect',
            eventCallback: function () {
              clearTimeout(fallback);
              go();
            },
            eventTimeout: 1200,
          });
        }
      })();
    </script>
